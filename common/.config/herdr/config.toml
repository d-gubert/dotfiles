onboarding = false
# herdr — terminal workspace manager for AI coding agents
# Docs: https://herdr.dev/docs/configuration/
#
# Keybinds ported from ../../.tmux.conf. Comments show the tmux original.
# Anything not set here keeps herdr's default (see: herdr --default-config).
#
# Validate with:                herdr config check
# Reload a running server with: herdr server reload-config

[theme]
name = "catppuccin"

[session]
resume_agents_on_restore = false

[experimental]
kitty_graphics = true

[ui]
# sidebar_start_collapsed = true
sidebar_max_width = 100
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
pane_gaps = false
agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[keys]
prefix = "alt+space"

# ── pane focus ───────────────────────────────────────────────────────────────
# Homerow shifted one to the right, same as tmux.
focus_pane_left  = "alt+j"       # tmux: bind -n M-j   select-pane -L
focus_pane_down  = "alt+k"       # tmux: bind -n M-k   select-pane -D
focus_pane_up    = "alt+l"       # tmux: bind -n M-l   select-pane -U
focus_pane_right = "alt+;"       # tmux: bind -n M-';' select-pane -R

# ── pane swap -───────────────────────────────────────────────────────────────
# Homerow shifted one to the right, same as tmux.
swap_pane_left  = "alt+shift+j"
swap_pane_down  = "alt+shift+k"
swap_pane_up    = "alt+shift+l"
swap_pane_right = "alt+shift+;"

# ── nav mode ───────────────────────────────────────────────────────────────
# Homerow shifted one to the right, same as tmux.
navigate_pane_left  = "j"
navigate_pane_down  = "k"
navigate_pane_up    = "l"
navigate_pane_right = ";"

navigate_workspace_up   = "K"
navigate_workspace_down = "L"

# ── tabs (tmux windows) ──────────────────────────────────────────────────────
# rename_tab   = "prefix+r"          # tmux: bind r command-prompt rename-window
new_tab      = "alt+t"             # tmux: bind -n M-w new-window
previous_tab = "alt+["
next_tab     = "alt+]"

# ── splits ───────────────────────────────────────────────────────────────────
split_vertical   = "alt+n"       # tmux: bind -n M-n split-window -h
split_horizontal = "alt+shift+n" # tmux: bind -n M-N split-window -v

# ── pane lifecycle ───────────────────────────────────────────────────────────
close_pane      = "prefix+x"     # tmux: bind x kill-pane (herdr default too)
zoom            = "prefix+f"     # tmux: bind f resize-pane -Z
detach          = "prefix+q"     # tmux: bind q detach-client (herdr default too)
edit_scrollback = "prefix+e"     # tmux: bind -n M-e (dump scrollback into $EDITOR)

# It defaulted to prefix+r, which rename_tab now owns.
resize_mode = "prefix+r"
copy_mode = "prefix+c"

# ── switches ───────────────────────────────────────────────────────────────────
switch_workspace = "alt+1..9"
switch_tab = "prefix+1..9"
focus_agent = "alt+shift+1..9"

# ── workspaces ───────────────────────────────────────────────────────────────────
# open_worktree = "alt+g"
workspace_picker = "alt+w"
new_workspace = "alt+shift+w"
goto = "alt+g"

# ── rename workspace after the repo ────────────────────────────────────────────────
# tmux: bind w run-shell -E '... tmux rename-window ...'
[[keys.command]]
key = "prefix+w"
type = "shell"
command = "$HOME/.config/herdr/scripts/rename-workspace-repo.sh"

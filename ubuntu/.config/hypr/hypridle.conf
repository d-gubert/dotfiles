# The idle daemon. See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# hypridle reads this file on its own, the way hyprlock reads hyprlock.conf.
# hyprland.conf does not source it. autostart.conf starts the daemon.
#
# hypridle counts the seconds since the last input and runs a command when a
# listener reaches its timeout. Each listener counts from the same idle point,
# not from the listener before it, so the timeouts below are absolute.

general {
    # loginctl lock-session sends a D-Bus signal. This is the command that
    # answers it, so the desktop and the suspend path both lock the same way.
    # pidof stops a second hyprlock from starting over the first one.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine suspends, not after it wakes. A lid close or a
    # low battery goes through this path.
    before_sleep_cmd = loginctl lock-session

    # Turn the outputs back on at wake. Without this the first keypress only
    # undoes dpms and you have to press a key twice.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Honor the D-Bus idle inhibit. A full-screen video in Firefox or Chrome
    # takes this lock, and the screen then stays on with no input.
    ignore_dbus_inhibit = false
}

# ── 9.5 min: lock ────────────────────────────────────────────────────────────
# Lock 30 s before the screen goes dark, not at the same second. hyprlock needs
# to draw its surface first: if dpms fires while it starts, the screen sleeps
# over an unlocked desktop and the next keypress shows it.
#
# loginctl lock-session goes through the D-Bus signal, and general:lock_cmd
# above answers it. The lid close takes the same path. SUPER + CTRL + L does
# not: bindings.conf runs hyprlock directly. Both end in one hyprlock, because
# lock_cmd checks pidof first.
listener {
    timeout = 570
    on-timeout = loginctl lock-session
}

# ── 10 min: screen off ───────────────────────────────────────────────────────
# dpms off puts every output to sleep. hyprlock already covers the desktop by
# now, so a keypress wakes the outputs to the password field.
#
# WARNING: this laptop drives HDMI-A-1 from the NVIDIA GPU, and that output
# does not always come back from dpms. If the HDMI screen stays dark after a
# keypress, cycle the output instead of reloading the config:
#
#     hyprctl keyword monitor "HDMI-A-1, disable"
#     hyprctl keyword monitor "HDMI-A-1, preferred, auto, 1"
listener {
    timeout = 400
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

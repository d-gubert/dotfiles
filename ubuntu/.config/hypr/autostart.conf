# Programs the session starts. exec-once runs at login only; a reload does not
# start a second copy.

# Hand the Wayland session variables to the user services and to the portals.
# Screen sharing and the file pickers read them from the D-Bus environment.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

exec-once = waybar
exec-once = mako

# No tray applets. waybar reads NetworkManager and BlueZ over D-Bus itself,
# and its network and bluetooth modules open nmtui and blueman-manager on a
# click. The i3 session still starts nm-applet and blueman-applet.

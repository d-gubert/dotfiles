# Colors, borders and behavior. The palette is Catppuccin Mocha, the same one
# rofi, alacritty and yazi use in this repo.

$accent = rgb(89b4fa)
$inactive = rgb(45475a)

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # No gap between windows and no gap to the screen edge, the way i3 and the
    # Omarchy config have it. The border marks the focused window instead.
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $inactive

    layout = dwindle
    resize_on_border = true
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # i3 draws no shadow and no blur, and both cost GPU time on the laptop.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    # Short and flat. A long animation makes a tiling move feel slow.
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 2, snappy
    animation = fade, 1, 2, snappy
    animation = workspaces, 1, 2, snappy, slidefade
    animation = layers, 1, 2, snappy
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# https://wiki.hypr.land/Configuring/Variables/#binds
binds {
    # Press the key of the workspace you are on and go back to the previous
    # one. This is i3's workspace_auto_back_and_forth.
    workspace_back_and_forth = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Do not start a window under the cursor just because the cursor moved.
    focus_on_activate = true
    # No wallpaper daemon runs yet, so keep the background plain.
    force_default_wallpaper = 0
}

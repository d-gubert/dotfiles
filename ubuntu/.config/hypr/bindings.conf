# Keybindings. These repeat the i3 bindings, so both sessions feel the same.
# See https://wiki.hypr.land/Configuring/Binds/
#
# bind  = press once          binde = repeat while held
# bindl = works when locked   bindm = mouse
# bindd = any of the above, with a description. Omarchy's o.bind takes a
#         description too, so every binding here carries one, and
#         SUPER + ALT + K lists them. A mouse bind takes no description.

$mod = SUPER

# ── Windows ──────────────────────────────────────────────────────────────────
bindd = $mod, Q, Close window, killactive
bindd = $mod, F, Fullscreen, fullscreen, 0
bindd = $mod, T, Toggle floating, togglefloating
bindd = $mod ALT, J, Toggle window split, togglesplit

# Omarchy binds the workspace layout toggle to SUPER + ALT + L. Plain Hyprland
# has one layout for the whole session, not one per workspace, so this one
# switches dwindle and master everywhere.
bindd = $mod ALT, L, Toggle layout, exec, ~/.config/hypr/scripts/layout-toggle.sh

# Move the focus with the home row: j is left, k is down, l is up and
# semicolon is right.
bindd = $mod, J, Focus on left window, movefocus, l
bindd = $mod, K, Focus on below window, movefocus, d
bindd = $mod, L, Focus on above window, movefocus, u
bindd = $mod, SEMICOLON, Focus on right window, movefocus, r

# Move the window itself, same keys.
bindd = $mod SHIFT, J, Move window left, movewindow, l
bindd = $mod SHIFT, K, Move window down, movewindow, d
bindd = $mod SHIFT, L, Move window up, movewindow, u
bindd = $mod SHIFT, SEMICOLON, Move window right, movewindow, r

# Drag a window with the mouse, the way i3's floating_modifier does. A mouse
# bind takes no description: Hyprland rejects bindm with one.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Applications ─────────────────────────────────────────────────────────────
bindd = $mod, RETURN, Terminal, exec, wezterm
bindd = $mod SHIFT, RETURN, Terminal (alacritty), exec, alacritty
bindd = $mod, E, Launcher, exec, rofi -show drun
bindd = $mod, B, Browser, exec, brave-browser --ozone-platform-hint=auto

# The clipboard history, on the same key as i3. The picker is rofi there and
# here, so the two sessions look the same.
bindd = $mod, V, Clipboard history, exec, ~/.config/hypr/scripts/clipboard.sh

# ── Workspaces ───────────────────────────────────────────────────────────────
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10

# movetoworkspace also follows the window, which is what the i3 bindings do.
bindd = $mod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

bindd = $mod SHIFT, H, Move workspace to next monitor, movecurrentworkspacetomonitor, +1

# ── Capture ──────────────────────────────────────────────────────────────────
# The same two keys as i3. Both scripts are Wayland ports of the i3 ones.
bindd = , PRINT, Screenshot an area, exec, ~/.config/hypr/scripts/screenshot.sh
bindd = $mod, S, Record an area, exec, ~/.config/hypr/scripts/screenrecord.sh

# ── Session ──────────────────────────────────────────────────────────────────
# Hyprland reloads the config in place and has no separate restart, so both i3
# keys do the same thing here.
bindd = $mod SHIFT, C, Reload the config, exec, hyprctl reload
bindd = $mod SHIFT, R, Reload the config, exec, hyprctl reload
bindd = $mod CTRL, L, Lock the screen, exec, hyprlock

# Omarchy keeps its keybinding menu on SUPER + SHIFT + K, because the home row
# took SUPER + K. That key moves a window down here, so the menu joins the
# other displaced Omarchy bindings on the SUPER + ALT row. The list is built
# from the descriptions in this file.
bindd = $mod ALT, K, Keybindings, exec, ~/.config/hypr/scripts/keybindings.sh

# ── Media and brightness ─────────────────────────────────────────────────────
binddl = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
binddl = , XF86AudioPause, Pause, exec, playerctl pause
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous
binddl = , XF86AudioMute, Mute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindde = , XF86AudioRaiseVolume, Volume up, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindde = , XF86AudioLowerVolume, Volume down, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindde = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl set +5%
bindde = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-

# ── Resize mode ──────────────────────────────────────────────────────────────
# Hyprland calls a mode a submap. SUPER + R enters it, the keys below resize
# the focused window, and Return, Escape or SUPER + R leaves it. Waybar shows
# the name of the active submap, so the bar marks the mode.
$resize_step = 100

bindd = $mod, R, Resize mode, submap, resize
submap = resize

# The home row, the same directions as the i3 mode.
bindde = , J, Shrink the width, resizeactive, -$resize_step 0
bindde = , SEMICOLON, Grow the width, resizeactive, $resize_step 0
bindde = , K, Shrink the height, resizeactive, 0 -$resize_step
bindde = , L, Grow the height, resizeactive, 0 $resize_step

bindde = , LEFT, Shrink the width, resizeactive, -$resize_step 0
bindde = , RIGHT, Grow the width, resizeactive, $resize_step 0
bindde = , UP, Shrink the height, resizeactive, 0 -$resize_step
bindde = , DOWN, Grow the height, resizeactive, 0 $resize_step

bindd = , RETURN, Leave resize mode, submap, reset
bindd = , ESCAPE, Leave resize mode, submap, reset
bindd = $mod, R, Leave resize mode, submap, reset

# i3 swallows every other key while a mode is active. Do the same, so a stray
# key cannot reach the window under the resize mode.
bind = , catchall, exec, true

submap = reset

# ── System mode ──────────────────────────────────────────────────────────────
# (e)xit, (r)eboot, (s)uspend, s(h)utdown -- the same keys as the i3 mode.
# Each action leaves the submap first, so the keyboard never stays captured.
bindd = $mod SHIFT, E, System mode, submap, system
submap = system

bindd = , E, Exit Hyprland, exec, hyprctl dispatch submap reset && hyprctl dispatch exit
bindd = , R, Reboot, exec, hyprctl dispatch submap reset && systemctl reboot
bindd = , H, Shut down, exec, hyprctl dispatch submap reset && systemctl poweroff
bindd = , S, Suspend, exec, hyprctl dispatch submap reset && systemctl suspend

bindd = , RETURN, Leave system mode, submap, reset
bindd = , ESCAPE, Leave system mode, submap, reset
bindd = $mod SHIFT, E, Leave system mode, submap, reset
bind = , catchall, exec, true

submap = reset

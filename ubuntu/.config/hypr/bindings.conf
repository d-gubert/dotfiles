# Keybindings. These repeat the i3 bindings, so both sessions feel the same.
# See https://wiki.hypr.land/Configuring/Binds/
#
# bind  = press once          binde = repeat while held
# bindl = works when locked   bindm = mouse

$mod = SUPER

# ── Windows ──────────────────────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod ALT, J, togglesplit

# Move the focus with the home row: j is left, k is down, l is up and
# semicolon is right.
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, SEMICOLON, movefocus, r

# Move the window itself, same keys.
bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, SEMICOLON, movewindow, r

# Drag a window with the mouse, the way i3's floating_modifier does.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Applications ─────────────────────────────────────────────────────────────
bind = $mod, RETURN, exec, wezterm
bind = $mod SHIFT, RETURN, exec, alacritty
bind = $mod, E, exec, rofi -show drun
bind = $mod, B, exec, brave-browser --ozone-platform-hint=auto

# ── Workspaces ───────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# movetoworkspace also follows the window, which is what the i3 bindings do.
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod SHIFT, H, movecurrentworkspacetomonitor, +1

# ── Session ──────────────────────────────────────────────────────────────────
# Hyprland reloads the config in place and has no separate restart, so both i3
# keys do the same thing here.
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod CTRL, L, exec, hyprlock

# ── Media and brightness ─────────────────────────────────────────────────────
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Resize mode ──────────────────────────────────────────────────────────────
# Hyprland calls a mode a submap. SUPER + R enters it, the keys below resize
# the focused window, and Return, Escape or SUPER + R leaves it. Waybar shows
# the name of the active submap, so the bar marks the mode.
$resize_step = 100

bind = $mod, R, submap, resize
submap = resize

# The home row, the same directions as the i3 mode.
binde = , J, resizeactive, -$resize_step 0
binde = , SEMICOLON, resizeactive, $resize_step 0
binde = , K, resizeactive, 0 -$resize_step
binde = , L, resizeactive, 0 $resize_step

binde = , LEFT, resizeactive, -$resize_step 0
binde = , RIGHT, resizeactive, $resize_step 0
binde = , UP, resizeactive, 0 -$resize_step
binde = , DOWN, resizeactive, 0 $resize_step

bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mod, R, submap, reset

# i3 swallows every other key while a mode is active. Do the same, so a stray
# key cannot reach the window under the resize mode.
bind = , catchall, exec, true

submap = reset

# ── System mode ──────────────────────────────────────────────────────────────
# (e)xit, (r)eboot, (s)uspend, s(h)utdown -- the same keys as the i3 mode.
# Each action leaves the submap first, so the keyboard never stays captured.
bind = $mod SHIFT, E, submap, system
submap = system

bind = , E, exec, hyprctl dispatch submap reset && hyprctl dispatch exit
bind = , R, exec, hyprctl dispatch submap reset && systemctl reboot
bind = , H, exec, hyprctl dispatch submap reset && systemctl poweroff
bind = , S, exec, hyprctl dispatch submap reset && systemctl suspend

bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mod SHIFT, E, submap, reset
bind = , catchall, exec, true

submap = reset

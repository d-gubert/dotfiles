# Monitor layout. See https://wiki.hypr.land/Configuring/Monitors/
#
# Hyprland keeps no state file for monitors. It applies the rules below every
# time an output appears, so a reconnect restores the same layout.
#
# The rules match by description, not by connector name. A monitor that moves
# to another port changes HDMI-A-1 or DP-2, but keeps its description. The
# description holds the serial, so it stays with the unit.
#
# To add a monitor, read its description from `hyprctl monitors all` and write
# a rule: monitor = desc:<description>, <mode>, <position>, <scale>
#
# Warning: leave a few seconds between two `hyprctl reload` calls. A reload
# during an unfinished page flip makes the drm commit fail, and the external
# output then scans out at an offset. Cycle the output to recover:
#   hyprctl keyword monitor "HDMI-A-1, disable" && sleep 2 && hyprctl reload

# The laptop panel. preferred takes 1920x1080@144, its only mode.
monitor = desc:Chimei Innolux Corporation 0x1521, preferred, 0x1080, 1

# The 4K Samsung, right of the laptop, top edges aligned. This is the layout
# the i3 profile in ubuntu/.config/i3/monitors/lu28r55.conf also uses.
monitor = desc:Samsung Electric Company LU28R55 HX5R100156, preferred, 1920x1080, 1.07

# Office monitor
monitor = desc:LG Electronics LG ULTRAWIDE 0x01010101, preferred, 0x0, 1

# Any monitor with no rule above: preferred mode, placed right of the ones
# already there. A named rule wins over this one.
monitor = , preferred, auto, 1

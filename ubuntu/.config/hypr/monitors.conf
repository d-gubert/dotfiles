# Monitor layout. See https://wiki.hypr.land/Configuring/Monitors/
#
# Every monitor takes its preferred mode, no scaling, and a position right of
# the ones already placed. That is enough for the laptop panel alone and for
# the laptop plus one external monitor.
#
# To pin a monitor, print the connected ones with `hyprctl monitors all` and
# add a rule for it here, by name or by description:
#   monitor = HDMI-A-1, 3840x2160@60, 1920x0, 1
#   monitor = desc:Samsung Electric Company LU28R55, preferred, 0x0, 1
monitor = , preferred, auto, 1

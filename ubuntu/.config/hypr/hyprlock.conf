# The screen locker, on SUPER + CTRL + L. See
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# hyprlock reads this file on its own. hyprland.conf does not source it, and
# hyprland.conf must not source it: the two programs have different config
# grammars. Up to v0.8 hyprlock fell back to built-in defaults when the file
# was absent. v0.9 refuses to start instead:
#
#     [CRITICAL] ConfigManager threw: Could not find config in HOME, ...
#
# A locker that refuses to start leaves the session unlocked, so this file is
# what makes the keybinding safe.
#
# The palette is Catppuccin Mocha, the same one looknfeel.conf, rofi,
# alacritty and yazi use in this repo.

$base = rgb(1e1e2e)
$surface = rgb(313244)
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$accent = rgb(89b4fa)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)

# waybar uses the same family. FiraCode Nerd Font is the fallback, so a
# machine without DejaVu still draws the clock.
$font = DejaVu Sans Mono

general {
    hide_cursor = true

    # ENTER on an empty field asks PAM to check nothing, and PAM answers with
    # a failure the field then shows in red. Swallow that keypress instead.
    ignore_empty_input = true
}

# The unlock animation. Short and flat, the way looknfeel.conf sets the window
# animations: a long fade makes the unlock feel slow.
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 2, snappy
    animation = fadeOut, 1, 2, snappy
    animation = inputFieldDots, 1, 2, snappy
}

# An empty `monitor =` draws the widget on every output. This laptop runs up
# to four, so name no monitor anywhere in this file.
#
# The sample config uses `path = screenshot` with blur. A blur is reversible
# and the desktop is what the lock screen must hide, so paint a flat color
# over each output instead.
background {
    monitor =
    color = $base
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 0

    inner_color = $surface
    outer_color = $accent
    font_color = $text
    font_family = $font

    # The three states of the outline: accent while you type, yellow while
    # PAM checks the password, red after PAM rejects it.
    check_color = $yellow
    fail_color = $red

    # Keep the box drawn when the field is empty. A box that fades out gives
    # no target to type into.
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_spacing = 0.3
    dots_center = true

    # Caps Lock is the first thing to suspect after a rejected password.
    # Recolor the outline while it is on.
    capslock_color = $yellow

    position = 0, -40
    halign = center
    valign = center
}

# ── Clock ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font

    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    # cmd[] reruns the command on the interval. The date changes once a day,
    # so a minute is often enough and costs one fork per minute.
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 22
    font_family = $font

    position = 0, 140
    halign = center
    valign = center
}

# ── Who is logged in ─────────────────────────────────────────────────────────
# The machine has one user, so this is a reminder of which session is locked,
# not a choice of account.
label {
    monitor =
    text = $USER
    color = $subtext
    font_size = 16
    font_family = $font

    position = 0, 20
    halign = center
    valign = center
}

# Environment variables for the session. Hyprland exports these to every
# program it starts, so they cover the apps, not the compositor itself.

# Tell the toolkits to use Wayland, and to fall back to XWayland when a
# program has no Wayland backend.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── NVIDIA ───────────────────────────────────────────────────────────────────
# This laptop has two GPUs: the Intel iGPU (i915, card1) drives eDP-1 and the
# two DisplayPort outputs, and the NVIDIA RTX 3060 (card2) drives HDMI-A-1.
# Hyprland must keep both, so do not restrict the device list. The NVIDIA
# driver also needs nvidia_drm.modeset=1, which Ubuntu already sets in
# /etc/modprobe.d/nvidia-graphics-drivers-kms.conf. Verify after a kernel
# update with: cat /sys/module/nvidia_drm/parameters/modeset
#
# Force hardware cursors on. Without this the laptop panel keeps a ghost
# cursor after login: it sits where the pointer was on the gdm greeter, stays
# above every window, and no repaint removes it.
#
# The default is "auto" (2), which turns hardware cursors off when Hyprland
# sees an NVIDIA GPU. Hyprland then never programs the cursor plane, so the
# plane the greeter left enabled on eDP-1 stays lit. The display controller
# draws that plane above everything the compositor renders, which is why
# software cursors make the ghost permanent instead of clearing it.
cursor {
    no_hardware_cursors = false

    # If the cursor flickers or disappears on the NVIDIA output, keep the
    # hardware plane and feed it a CPU buffer instead of dropping back to
    # software cursors.
    # use_cpu_buffer = true
}

# Uncomment a line below only for the problem it names.
#
# The compositor renders on the wrong GPU. This pins the render device; the
# path survives a reboot, /dev/dri/cardN does not.
# env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:00:02.0-card:/dev/dri/by-path/pci-0000:01:00.0-card
#
# Hardware video decode picks the wrong driver. Set one, not both.
# env = LIBVA_DRIVER_NAME,nvidia
# env = LIBVA_DRIVER_NAME,iHD

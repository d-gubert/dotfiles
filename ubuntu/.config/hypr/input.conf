# Keyboard and pointer. See https://wiki.hypr.land/Configuring/Variables/#input

input {
    # The same two layouts the i3 session sets with setxkbmap: US
    # international first, Brazilian second, SUPER + SPACE toggles them.
    kb_layout = us,br
    kb_variant = intl,
    kb_options = grp:win_space_toggle

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        # Scroll the content, not the viewport. This matches macOS, the i3
        # session and the Omarchy config.
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Three fingers across the touchpad change the workspace.
gesture = 3, horizontal, workspace

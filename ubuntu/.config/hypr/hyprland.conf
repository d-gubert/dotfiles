# Hyprland on Ubuntu. See https://wiki.hypr.land/Configuring/
#
# This is a second session beside i3, not a replacement: gdm lists both and
# ~/.config/i3 stays as it is. The bindings below repeat the i3 ones, so the
# two sessions feel the same.
#
# Omarchy has its own Lua config layer in arch/.config/hypr/*.lua. Plain
# Hyprland does not read Lua, so the same decisions live here in hyprland
# syntax. Change a preference in both packages or the machines drift apart.
#
# Reload after an edit with SUPER + SHIFT + C, or `hyprctl reload`.

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
# nwg-displays writes workspaces.conf. It pins each workspace to a monitor,
# which is what sends the workspaces back after a monitor reconnects.
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/autostart.conf

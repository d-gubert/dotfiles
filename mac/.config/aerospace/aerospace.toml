# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# AeroSpace adds itself to the macOS login items
start-at-login = true

# In i3, all workspaces are phantom
persistent-workspaces = []

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# 'main' is the monitor with the menu bar. 'secondary' is the other one.
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'
    10 = 'secondary'

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    alt-enter = '''exec-and-forget osascript -e \
    'tell application "Terminal" to tell (do script) to activate' '''

    # i3 wraps focus by default
    cmd-j =         'focus --boundaries-action wrap-around-the-workspace left'
    cmd-k =         'focus --boundaries-action wrap-around-the-workspace down'
    cmd-l =         'focus --boundaries-action wrap-around-the-workspace up'
    cmd-semicolon = 'focus --boundaries-action wrap-around-the-workspace right'

    cmd-alt-j = 'move left'
    cmd-alt-k = 'move down'
    cmd-alt-l = 'move up'
    cmd-alt-semicolon = 'move right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-h = 'split horizontal'
    alt-v = 'split vertical'

    alt-f = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'
    cmd-9 = 'workspace 9'
    cmd-0 = 'workspace 10'

    cmd-alt-1 = 'move-node-to-workspace --focus-follows-window 1'
    cmd-alt-2 = 'move-node-to-workspace --focus-follows-window 2'
    cmd-alt-3 = 'move-node-to-workspace --focus-follows-window 3'
    cmd-alt-4 = 'move-node-to-workspace --focus-follows-window 4'
    cmd-alt-5 = 'move-node-to-workspace --focus-follows-window 5'
    cmd-alt-6 = 'move-node-to-workspace --focus-follows-window 6'
    cmd-alt-7 = 'move-node-to-workspace --focus-follows-window 7'
    cmd-alt-8 = 'move-node-to-workspace --focus-follows-window 8'
    cmd-alt-9 = 'move-node-to-workspace --focus-follows-window 9'
    cmd-alt-0 = 'move-node-to-workspace --focus-follows-window 10'

    # i3: bindsym $mod+Shift+h move workspace to output next
    cmd-alt-h = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'

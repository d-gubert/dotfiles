# Environment that has to name the workspace, which `../env` cannot: that file is
# one checked-in KEY=VALUE list shared by every worktree, and the placeholders
# are only substituted in these compose fragments (see ../../README.md).
#
# OTEL_RESOURCE_ATTRIBUTES rides along on everything Claude Code exports, so
# these two arrive as labels in Prometheus and a panel can break cost or tokens
# down by checkout instead of totalling every worktree into one line.
#
# Comma-separated key=value, so neither value may contain a comma or an equals
# sign — a workspace path contains neither.
OTEL_RESOURCE_ATTRIBUTES: "workspace=%WORKSPACE%,devbox.profile=%PROFILE%"

# Join the shared MongoDB's network (declared in ./networks.yml), which is what
# makes `mongo:27017` resolve inside the container — the address in MONGO_URL,
# and the one the replica set advertises for itself.
#
# Only what this profile adds. Compose merges a service's `networks` across
# files, so `default` from ../../../docker-compose.yml stays, and the
# `observability` entry that ../../../scripts/ensure-observability.sh contributes
# lands in the same list. Repeating either here would work for compose, but this
# fragment and that one would then be two silently diverging copies.
- local-mongo

# Shared Turborepo remote cache — https://ducktors.github.io/turborepo-remote-cache
#
# ****************************************************************************
# DORMANT. Nothing starts this file and no container talks to it. Turbo's cache
# is now a host directory mounted into every workspace — see
# ../scripts/ensure-caches.sh for what it does and why it won.
#
# It is kept because the swap is reversible and this file is the hard part of
# it. The restore notes below describe the DEVCONTAINER backend devbox used to
# run on, and none of those files exists any more (`git log -- containers/` has
# them). On Docker Sandboxes the equivalent is harder still: a sandbox cannot
# join this stack's network, so a cache server would have to be reached through
# a published port and host.docker.internal. What was unwired:
#
#   ../scripts/initialize.sh   call ensure-turbo-cache.sh instead of
#                              ensure-turbo-cache-dir.sh
#   ../docker-compose.yml      `turbo-cache` in the top-level networks (external)
#                              and in services.app.networks
#   ../devcontainer.json       TURBO_API=http://turbo-cache:3000, TURBO_TEAM,
#                              TURBO_TOKEN
#   ../allowed-domains         the 172.30.0.0/24 entry, or every artifact
#                              request is REJECTed by the firewall
#
# WARNING: TURBO_TOKEN below and the one in devcontainer.json must match, and
# nothing checks that they do. They drifted once and the whole cache went quiet:
# the server keeps the token it was CREATED with (`restart: unless-stopped`, and
# ../scripts/ensure-turbo-cache.sh returns early when the container is running),
# so a stale value survives every reboot. Every artifact request 401s, turbo
# prints one WARNING line per task and silently builds everything locally.
# `/v8/artifacts/status` needs no auth and answers 200 throughout, so a
# connectivity check does not catch it. Recreate the server after any change:
# `docker compose -p turbo-cache -f <this file> up -d --force-recreate cache`.
# ****************************************************************************
#
# This is a STANDALONE compose project (`name:` below), deliberately NOT part of
# any devcontainer's own project: every workspace gets its own devcontainer
# compose project, so anything defined there would be duplicated per workspace
# and each copy would have its own empty cache. One project, started once on the
# host by ../scripts/ensure-turbo-cache.sh, is shared by all of them.
#
# The devcontainers reach it over the `turbo-cache` network declared at the
# bottom, which they attach to as an external network. Nothing about this file is
# workspace-specific, so whichever container comes up first wins and the rest
# just find it already running.
name: turbo-cache

services:
  # The artifact volume is a named volume, so its mount point lands root-owned
  # while the server runs as uid 1001 (`app`) — it could not create anything
  # under it. Compose has no chown, so a throwaway init service does it once and
  # exits; the server waits for it to complete.
  init:
    image: busybox:1.37
    command: sh -c 'mkdir -p /data && chown -R 1001:1001 /data'
    volumes:
      - turbo-cache-data:/data
    # Only to keep compose from creating a second, unused default network for it.
    networks:
      - turbo-cache

  cache:
    image: ducktors/turborepo-remote-cache:2.11.5
    container_name: turbo-cache
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # Shared secret between this server and every turbo client. Local-only
      # cache on a private docker network, so this is a fixed well-known value
      # rather than a managed secret — override by exporting TURBO_TOKEN before
      # the ensure script runs, and set the same value in devcontainer.json.
      TURBO_TOKEN: ${TURBO_TOKEN:-devbox-local-dev}
      STORAGE_PROVIDER: local
      # Without this the path is forced under /tmp, which is container-local and
      # would drop the whole cache on every restart.
      STORAGE_PATH_USE_TMP_FOLDER: "false"
      STORAGE_PATH: /data
      # Bundles from a large monorepo go well past the 100MB default.
      BODY_LIMIT: "536870912"
      LOG_LEVEL: info
    volumes:
      - turbo-cache-data:/data
    networks:
      - turbo-cache
    # Loopback-only so the cache is usable from the host too (a plain build
    # outside a devcontainer) without exposing it to the LAN.
    ports:
      - "127.0.0.1:3399:3000"

volumes:
  # Single volume in a single project = one cache for every workspace.
  turbo-cache-data:

networks:
  turbo-cache:
    # Fixed name so devcontainers can reference it as an external network
    # without the `turbo-cache_` project prefix compose would otherwise add.
    name: turbo-cache
    ipam:
      config:
        # Pinned because the devcontainer's egress firewall allowlists this exact
        # CIDR (see ../allowed-domains). Chosen outside the range Docker has
        # handed out so far (172.17–172.23) but inside its default pool, so
        # claiming it also keeps the auto-allocator off it.
        - subnet: 172.30.0.0/24

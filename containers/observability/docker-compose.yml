# Local observability stack: an OpenTelemetry Collector, Prometheus and Grafana.
#
# One stack per machine, shared by everything that produces metrics — Claude Code
# on the host, Claude Code in a devbox container, the Rocket.Chat server in a
# devbox container, and whatever you add next. Start it with ./up.sh, which is
# also what a devbox profile calls from its initialize.sh.
#
# Two ways in, because the two starter sources speak different protocols:
#
#   push   OTLP on 4317 (gRPC) and 4318 (HTTP) -> the collector -> Prometheus,
#          over remote write. This is Claude Code's path.
#   pull   Prometheus scrapes a container that exposes /metrics. This is
#          Rocket.Chat's path, and the target list is discovered from Docker
#          labels — see prometheus/prometheus.yml.
#
# This is a STANDALONE compose project (`name:` below), never part of a
# devcontainer's own project: every devbox workspace runs its own compose
# project, so a copy defined in there would be one Prometheus per workspace, each
# with its own empty database. Same argument as ../devcontainer/turbo-cache.
name: observability

services:
  # --- The push door ----------------------------------------------------------
  #
  # Everything that exports OTLP sends here, and the collector forwards to
  # Prometheus over remote write. A collector rather than Prometheus's own OTLP
  # receiver, because this is where per-source processing goes when a source
  # needs it (renaming, filtering, dropping a high-cardinality attribute) without
  # touching the source or the database.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: observability-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # Loopback-only: the host's own Claude Code sends to 127.0.0.1:4317, and
      # nothing on the LAN has any business pushing metrics in here. A container
      # does NOT use these — it joins the `observability` network below and sends
      # to `otel-collector:4317` directly.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - observability
    depends_on:
      # Writing to a Prometheus, a Loki or a Tempo that is not up yet costs a few
      # retries and a wall of errors in the log. Only ordering — no healthcheck
      # condition, the collector retries either way.
      - prometheus
      - loki
      - tempo

  # --- The database -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: observability-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep every sample. Unset, Prometheus deletes anything older than 15 days,
      # which loses the month-over-month comparisons this stack exists for.
      #
      # 100y, not 0: Prometheus treats a zero retention as "nothing was chosen"
      # and falls back to the same 15 day default. 100y is its own ceiling, so
      # this is as close to "no limit" as the flag goes. The disk is now the only
      # bound — add --storage.tsdb.retention.size if that ever matters.
      - --storage.tsdb.retention.time=100y
      # The collector pushes; without this flag /api/v1/write 404s and every
      # pushed metric is silently lost.
      - --web.enable-remote-write-receiver
      # Reload the scrape config with `curl -XPOST localhost:9090/-/reload`
      # instead of restarting the container.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability
    depends_on:
      - docker-socket-proxy

  # --- The log store ----------------------------------------------------------
  #
  # Metrics say how many tokens a session spent; the events here say which
  # prompt, which tool and which API call. Prometheus cannot hold them — a log
  # line is not a time series — so the collector forks its OTLP input and writes
  # logs here instead.
  loki:
    image: grafana/loki:3.7.6
    container_name: observability-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      # Loopback-only, like the rest. Grafana reaches it over the network below;
      # this port is for `logcli` and curl from the host.
      - "127.0.0.1:3100:3100"
    networks:
      - observability

  # --- The trace store --------------------------------------------------------
  #
  # The third signal. A metric counts tool calls and an event records that one
  # happened; a trace here says which API call and which tool ran inside which
  # prompt, and how long each waited. Neither Prometheus nor Loki can hold that
  # shape, so the collector forks its OTLP input once more and writes spans here.
  tempo:
    image: grafana/tempo:2.10.7
    container_name: observability-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      # Loopback-only, like the rest. Grafana reaches it over the network below;
      # this port is for curl against the API from the host.
      - "127.0.0.1:3200:3200"
    networks:
      - observability

  # --- Service discovery for the `devbox` scrape job --------------------------
  #
  # Prometheus finds its targets by asking the Docker API which containers carry
  # the devbox.metrics.* labels (see prometheus/prometheus.yml). It asks through
  # this proxy rather than through a mounted /var/run/docker.sock, for two
  # reasons:
  #
  #   * The socket is root:docker 0660 and the Prometheus image runs as `nobody`,
  #     so a direct mount needs the host's docker group id — a number that
  #     differs per machine and cannot be checked into this file.
  #   * `:ro` on a socket mount buys nothing. It makes the socket file
  #     unwritable, not the API read-only: whoever reaches that socket can
  #     create a privileged container and own the host. The proxy is a real
  #     restriction — the variables below are an allowlist of API paths, and
  #     everything not listed answers 403.
  #
  # Only the two endpoints Prometheus's Docker discovery calls are open, and both
  # are GET-only while POST=0.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: observability-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No `ports`: nothing outside this network has any business here.
    networks:
      - observability

  # --- The front end ----------------------------------------------------------
  grafana:
    image: grafana/grafana:13.1.3
    container_name: observability-grafana
    restart: unless-stopped
    environment:
      # No login on a loopback-only local stack. Anonymous visitors are Admins so
      # panels can be edited and explored without an account; the dashboards
      # under ./grafana/dashboards are provisioned read-only anyway, so an edit
      # is a "save as", never a change to a file in this repo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Grafana phones home for version checks and plugin listings. Nothing here
      # needs either.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3030, not Grafana's own 3000: that one is Rocket.Chat's, and this stack
      # is meant to run at the same time as it.
      - "127.0.0.1:3030:3000"
    networks:
      - observability

volumes:
  # Metrics history and Grafana's own database (users, saved dashboards,
  # preferences). Ordinary volumes — the fixed project name above is what keeps
  # them the same two volumes no matter where the stack is started from.
  prometheus-data:
  grafana-data:
  # Loki's chunks and index. A named volume, not a bind mount: the image ships
  # /loki owned by its own uid, and a fresh named volume inherits that ownership
  # while a bind mount would arrive root-owned and unwritable.
  loki-data:
  # Tempo's WAL and blocks. Same argument as loki-data — the image ships
  # /var/tempo owned by uid 10001 and runs as that user.
  tempo-data:

networks:
  observability:
    # Fixed name so a devcontainer can attach to it as an external network,
    # without the `observability_` project prefix compose would otherwise add.
    name: observability
    ipam:
      config:
        # Pinned because the devbox egress firewall allowlists this exact CIDR
        # (../devcontainer/projects/rocketchat/allowed-domains) — a second
        # network is not covered by the rule the firewall derives from the
        # container's own bridge. Chosen outside the range Docker has handed out
        # so far but inside its default pool, beside turbo-cache (172.30.0.0/24)
        # and local-mongo (172.31.0.0/24). Change one, change both.
        - subnet: 172.29.0.0/24

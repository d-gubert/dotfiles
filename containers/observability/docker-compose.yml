# Local observability stack: OpenTelemetry Collector + Prometheus + Grafana.
#
# The collector is the single ingestion point. Anything speaking OTLP (Claude
# Code, apps, SDKs) pushes to it on 4317/4318; anything speaking Prometheus is
# scraped by Prometheus directly. Both feed Grafana.
#
#   Grafana     -> http://localhost:3001   (admin / admin by default)
#   Prometheus  -> http://localhost:9090
#   OTLP gRPC   -> localhost:4317          (host processes, e.g. Claude Code)
#   OTLP HTTP   -> localhost:4318
#
# The `observability` network is created by this stack (bring it up first) so
# other Compose projects — like a Rocket.Chat devcontainer — can join it as an
# external network and reach `otel-collector` / be scraped by `prometheus` by
# service name. See ./README.md and ../rocket.chat/.
name: observability

networks:
  observability:
    name: observability

volumes:
  prometheus-data:
  grafana-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.116.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus below)
    networks:
      - observability

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.1.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3001 on the host to stay clear of Rocket.Chat's 3000
    depends_on:
      - prometheus
    networks:
      - observability

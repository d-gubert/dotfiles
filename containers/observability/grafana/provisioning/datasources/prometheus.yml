# The stack's only datasource, provisioned so a fresh grafana-data volume needs
# no clicking. `uid` is fixed because the dashboards in ../../dashboards refer to
# it by uid — let Grafana generate one and every panel loses its datasource.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: observability-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match `global.scrape_interval` in ../../../prometheus/prometheus.yml,
      # or Grafana's `$__rate_interval` comes out too short and rate() over a
      # single sample returns nothing.
      timeInterval: 10s

# OpenTelemetry Collector (contrib) configuration.
#
# Receives OTLP from any source (Claude Code, apps, SDKs) and re-exposes the
# metrics on :8889 in Prometheus format so the Prometheus service can scrape
# them. Traces and logs are accepted too and sent to the debug exporter — swap
# that for a real backend (Tempo/Loki/OTLP) when you want to keep them.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Keep resource attributes (service.name, etc.) as metric labels so you can
  # tell Claude Code apart from Rocket.Chat and any future source in Grafana.
  resourcedetection:
    detectors: [env]
    timeout: 2s

exporters:
  # Exposed on :8889/metrics; Prometheus scrapes it (see prometheus/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      # Collector's own internal metrics, scraped as the otel-collector-internal job.
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug]

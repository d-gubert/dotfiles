# Local MongoDB (single-node replica set), NATS and Traefik for Rocket.Chat
# development on the host.
#
# Fixed project name so the stack is the same one no matter where it is started
# from — the devcontainer's initializeCommand brings the `mongo` service up with
# `-p local-mongo` from a different cwd, and with COMPOSE_PROJECT_NAME already
# exported for the devcontainer's own project. See
# ../devcontainer/projects/rocketchat/initialize.sh.
name: local-mongo

volumes:
  mongo-data-1:

networks:
  # The project's default network, renamed so every service in here keeps
  # working with no per-service `networks:` while the network gets a stable name
  # a devcontainer can attach to as `external`. That is how the Rocket.Chat
  # devcontainer reaches `mongo:27017` by name — which it must, because the
  # replica set advertises its member as `$MONGODB_INITIAL_PRIMARY_HOST:27017`
  # (`mongo:27017`) and any driver connecting to it follows that hostname, so a
  # published-port address alone is not enough.
  default:
    name: local-mongo
    ipam:
      config:
        # Pinned because the devcontainer's egress firewall allowlists this exact
        # CIDR (../devcontainer/projects/rocketchat/allowed-domains) — a second
        # network is not covered by the rule it derives from its own bridge.
        # Chosen outside the range Docker has handed out so far but inside its
        # default pool, like ../devcontainer/turbo-cache/docker-compose.yml.
        # Change one, change both.
        - subnet: 172.31.0.0/24

services:
  mongo:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-7.0}-ubi8
    restart: on-failure
    ports:
      - 27017:27017
    environment:
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME:-rs0}
      MONGODB_PORT_NUMBER: ${MONGODB_PORT_NUMBER:-27017}
      MONGODB_INITIAL_PRIMARY_HOST: ${MONGODB_INITIAL_PRIMARY_HOST:-mongo}
    volumes:
      - mongo-data-1:/data/db
    entrypoint: |
      bash -c
        "mongod --replSet $$MONGODB_REPLICA_SET_NAME --bind_ip_all &
          sleep 2;
          until mongosh --eval \"db.adminCommand('ping')\"; do
            echo '=====> Waiting for Mongo...';
            sleep 1;
          done;
          echo \"=====> Initiating ReplSet $$MONGODB_REPLICA_SET_NAME at $$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER...\";
          mongosh --eval \"rs.initiate({_id: '$$MONGODB_REPLICA_SET_NAME', members: [{ _id: 0, host: '$$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER' }]})\";
          echo '=====> Initiating ReplSet done...';
        wait"

  nats:
    image: nats:2.6-alpine

  traefik:
    image: traefik:v3.6.6
    command:
      - --providers.docker=true
      - '--serverstransport.maxidleconnsperhost=-1'
    ports:
      - 3000:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

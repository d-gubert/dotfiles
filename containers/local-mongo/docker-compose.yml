# Local MongoDB (single-node replica set), NATS and Traefik for Rocket.Chat
# development on the host.
#
# Fixed project name so the stack is the same one no matter where it is started
# from — the rocketchat devbox profile brings the `mongo` service up with
# `-p local-mongo` from a different cwd, before the sandbox is created. See
# ../sandbox/projects/rocketchat/initialize.sh.
name: local-mongo

volumes:
  mongo-data-1:

networks:
  # The project's default network, renamed so every service in here keeps
  # working with no per-service `networks:` while the network gets a stable name
  # another compose project can attach to as `external`.
  #
  # A devbox sandbox cannot attach to it — a microVM has its own network
  # namespace — so it connects to the published port through
  # host.docker.internal with `directConnection=true`. That flag is needed
  # because the replica set advertises its member as
  # `$MONGODB_INITIAL_PRIMARY_HOST:27017` (`mongo:27017`), a name that does not
  # resolve out there, and a driver follows the advertised address unless told
  # not to. See ../sandbox/projects/rocketchat/env.
  default:
    name: local-mongo
    ipam:
      config:
        # Pinned so the subnet is stable for anything that has to name it. The
        # devbox egress allowlist used to be one such thing and is not any more —
        # a sandbox does not route to this network at all. Chosen outside the
        # range Docker has handed out so far but inside its default pool, like
        # ../sandbox/turbo-cache/docker-compose.yml.
        - subnet: 172.31.0.0/24

services:
  mongo:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-7.0}-ubi8
    restart: on-failure
    ports:
      - 27017:27017
    environment:
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME:-rs0}
      MONGODB_PORT_NUMBER: ${MONGODB_PORT_NUMBER:-27017}
      MONGODB_INITIAL_PRIMARY_HOST: ${MONGODB_INITIAL_PRIMARY_HOST:-mongo}
    volumes:
      - mongo-data-1:/data/db
    entrypoint: |
      bash -c
        "mongod --replSet $$MONGODB_REPLICA_SET_NAME --bind_ip_all &
          sleep 2;
          until mongosh --eval \"db.adminCommand('ping')\"; do
            echo '=====> Waiting for Mongo...';
            sleep 1;
          done;
          echo \"=====> Initiating ReplSet $$MONGODB_REPLICA_SET_NAME at $$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER...\";
          mongosh --eval \"rs.initiate({_id: '$$MONGODB_REPLICA_SET_NAME', members: [{ _id: 0, host: '$$MONGODB_INITIAL_PRIMARY_HOST:$$MONGODB_PORT_NUMBER' }]})\";
          echo '=====> Initiating ReplSet done...';
        wait"

  nats:
    image: nats:2.6-alpine

  traefik:
    image: traefik:v3.6.6
    command:
      - --providers.docker=true
      - '--serverstransport.maxidleconnsperhost=-1'
    ports:
      - 3000:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
